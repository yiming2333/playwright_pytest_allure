<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - Playwright 靶场</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 24px; margin: 24px auto; max-width: 400px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h2 { color: #1976d2; margin-bottom: 16px; }
        .subtitle { color: #666; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        label { display: inline-block; min-width: 80px; font-weight: 500; }
        input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #1976d2; color: white; border: none; cursor: pointer; padding: 10px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; width: 100%; margin-top: 12px; }
        button:hover { background: #1565c0; }
        .result { margin-top: 12px; padding: 10px 14px; background: #e8f5e9; color: #2e7d32; border-radius: 6px; display: none; font-weight: bold; }
        .result.error { background: #ffebee; color: #c62828; }
        .nav { background: #1976d2; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav a { color: white; text-decoration: none; margin: 0 12px; font-weight: 500; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { padding: 12px 20px; border-radius: 8px; margin-bottom: 8px; color: white; font-weight: 500; }
        .toast.success { background: #43a047; }
        .toast.error { background: #e53935; }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div class="nav">
        <div>
            <a href="/">🏠 首页</a>
            <a href="/login">🔐 登录</a>
        </div>
        <div></div>
    </div>
    <div class="card">
        <h2>🔐 用户登录</h2>
        <p class="subtitle">测试账号：admin/admin123, editor/edit456, viewer/view789</p>
        <form onsubmit="event.preventDefault(); doLogin();">
            <div class="form-group">
                <label for="login-user">用户名</label>
                <input id="login-user" type="text" placeholder="请输入用户名" />
            </div>
            <div class="form-group">
                <label for="login-pass">密码</label>
                <input id="login-pass" type="password" placeholder="请输入密码" />
            </div>
            <button type="submit" id="login-btn">登 录</button>
        </form>
        <div class="result" id="login-result" style="margin-top:12px;"></div>
    </div>
<script>
function showToast(msg, type) {
    const container = document.getElementById('toast-container') || document.body;
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:white;z-index:9999;';
    toast.style.background = type === 'error' ? '#e53935' : '#43a047';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

async function doLogin() {
    const username = document.getElementById('login-user').value;
    const password = document.getElementById('login-pass').value;
    const resultEl = document.getElementById('login-result');

    try {
        const resp = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await resp.json();

        if (data.success) {
            resultEl.className = 'result';
            resultEl.textContent = '✅ 登录成功！正在跳转...';
            resultEl.style.display = 'block';
            showToast('登录成功！', 'success');
            setTimeout(() => window.location.href = '/', 1000);
        } else {
            resultEl.className = 'result error';
            resultEl.textContent = '❌ ' + data.error;
            resultEl.style.display = 'block';
            showToast(data.error, 'error');
        }
    } catch(e) {
        showToast('网络错误', 'error');
    }
}
</script>
</body>
</html>
