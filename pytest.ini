[pytest]
addopts = -v --alluredir=./allure-results
testpaths = tests
base_url = http://127.0.0.1:5000
# 关闭测试 ID 中文转义，让 [chromium-全部商品] 而不是 [chromium-\u5168\u90e8\u5546\u54c1]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers =
    role: Role 定位测试
    advanced: 进阶链式/过滤测试
    no_home_navigation: 跳过 autouse 的 navigate_to_home（用于从 /login 等其他 URL 开始的用例）
