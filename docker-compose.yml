services:
  mock_server:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "5000:5000"   # 保留，方便调试时用浏览器访问
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 2s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - BASE_URL=http://mock_server:5000
      - TZ=Asia/Shanghai
    shm_size: '2g'           # 等同于 --shm-size=2g
    depends_on:
      mock_server:
        condition: service_healthy   # 等待 Flask 就绪后再启动
    command: pytest -n auto -v
    volumes:
      - ./reports:/app/reports        # 假设你的报告生成在 /app/reports
      - ./allure-results:/app/allure-results  # 假设 allure 结果在这里
      - ./logs:/app/logs              # 如果有日志目录