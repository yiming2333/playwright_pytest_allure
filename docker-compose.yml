services:
  mock_server:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "5000:5000"   # 保留，方便调试时用浏览器访问
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 2s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - BASE_URL=http://mock_server:5000
    depends_on:
      mock_server:
        condition: service_healthy   # 等待 Flask 就绪后再启动
    command: pytest -n auto -v