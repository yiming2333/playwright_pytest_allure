services:
  mock_server:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 2s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - BASE_URL=http://mock_server:5000
      - TZ=Asia/Shanghai
    shm_size: 2g
    depends_on:
      mock_server:
        condition: service_healthy
    # 关键：固定并行数 + 显式报告路径
    command: pytest -n 4 -v --alluredir=/app/allure-results
    volumes:
        - ./allure-results:/app/allure-results
        - ./allure-reports:/app/allure-report
        - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G   # 硬限制，防止极端情况撑爆宿主机